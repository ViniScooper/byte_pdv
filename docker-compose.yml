version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pdv_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: viniZIKA3103
      MYSQL_DATABASE: pdv_cantina
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically initializes the schema and seeds the admin user on first run
      - ./mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pdv_network

  backend:
    build:
      context: ./backend
    container_name: pdv_backend_api
    restart: always
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=viniZIKA3103
      - DB_NAME=pdv_cantina
      - DATABASE_URL=mysql://root:viniZIKA3103@db:3306/pdv_cantina
      - JWT_SECRET=minha_chave_super_secreta_123
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - pdv_network

  frontend:
    build:
      context: .
    container_name: pdv_frontend_ui
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - pdv_network

volumes:
  db_data:

networks:
  pdv_network:
    driver: bridge
